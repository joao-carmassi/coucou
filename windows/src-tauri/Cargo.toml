[package]
name = "coucou"
description = "Coucou for Windows — Mochi lives at the top of your screen"
authors = ["Louis Raille"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coucou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = { version = "1", features = ["preserve_order"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }
png = "0.17"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
keyring = { version = "3", features = ["windows-native"] }

windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Com",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_System_Variant",
  # C3: features for upcoming waves, declared once so later waves never touch this file.
  "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Media_Ocr",
  "Graphics_Imaging", "Globalization", "Storage", "UI_Notifications", "Data_Xml_Dom",
  "Win32_System_WinRT", "Win32_System_Performance", "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_Registry",
  "Win32_System_Ioctl", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_Devices_DeviceAndDriverInstallation", "Win32_UI_Accessibility",
  "Win32_Media_Audio_Endpoints", "Win32_Media_Speech", "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Pipes",
  "Wdk_Graphics_Direct3D",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# F03: FFT for the spectrum (nowplaying loopback analysis).
realfft = "3"
toml_edit = "0.22"
# sysmon: extracts the pinned LibreHardwareMonitor zip (enclosed_name blocks path traversal).
zip = { version = "2", default-features = false, features = ["deflate"] }
hmac = "0.12"
# crypto: Coinbase CDP JWT (ES256). Signing only; no other curve.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
# `#[implement]` (drop_target.rs) expands to paths in windows-core.
windows-core = "0.61"
# Same version wry resolves; ICoreWebView2_19 (memory target) for the hidden settings webview.
webview2-com = "0.39"
# webview2-com 0.39 is built on windows-core 0.62 (its Interface trait is needed for cast()).
windows-core-062 = { package = "windows-core", version = "0.62" }

